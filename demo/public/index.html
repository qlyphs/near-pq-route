<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (id) => document.getElementById(id);
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
const spring = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : 1 - Math.exp(-6 * t) * Math.cos(9 * t));
const wait = (ms) => new Promise((r) => setTimeout(r, reduce ? 0 : ms));
const C = { warm: new THREE.Color('#F27644'), red: new THREE.Color('#FF3B2E'), white: new THREE.Color('#EDEAE2'), dim: new THREE.Color('#55534e') };

// NEAR mainnet protocols and how many classical keys stand behind their upgrade path (DAO council size, or
// a single full-access key). Read on chain in November 2026.
const PROTOCOLS = [['Rhea Finance', 5], ['Rhea Lending', 5], ['LiNEAR', 5], ['Meta Pool', 4], ['NEAR Intents', 5], ['Omni Bridge', 5], ['Aurora', 1], ['USDC', 1]];

// ---------- Renderer, scene, ASCII pass ----------
const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x000000);
const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 300);
scene.add(new THREE.HemisphereLight(0xffffff, 0x1a1a1a, 1.0));
const sun = new THREE.DirectionalLight(0xffffff, 2.6); sun.position.set(6, 10, 7); scene.add(sun);
const rim = new THREE.DirectionalLight(0xffffff, 0.9); rim.position.set(-8, 3, -6); scene.add(rim);

const CHARS = ' .:-=+*#%@';
const rt = new THREE.WebGLRenderTarget(2, 2, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
function glyphAtlas(cw, ch) {
  const s = 3, c = document.createElement('canvas'); c.width = cw * s * CHARS.length; c.height = ch * s;
  const g = c.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = `600 ${Math.round(ch * s * 0.8)}px "Geist Mono", ui-monospace, Menlo, monospace`;
  [...CHARS].forEach((k, i) => g.fillText(k, (i + 0.5) * cw * s, ch * s * 0.54));
  const t = new THREE.CanvasTexture(c); t.minFilter = t.magFilter = THREE.LinearFilter; t.generateMipmaps = false; return t;
}
const ascii = new THREE.ShaderMaterial({
  uniforms: { tScene: { value: rt.texture }, tGlyph: { value: null }, res: { value: new THREE.Vector2() }, cell: { value: new THREE.Vector2(8, 14) }, n: { value: CHARS.length }, bg: { value: new THREE.Color('#0B0B0A') } },
  vertexShader: 'void main(){ gl_Position = vec4(position.xy, 0., 1.); }',
  fragmentShader: `
    uniform sampler2D tScene, tGlyph; uniform vec2 res, cell; uniform float n; uniform vec3 bg;
    void main() {
      vec2 p = gl_FragCoord.xy, id = floor(p / cell), uv = (id + .5) * cell / res, o = cell / res * .25;
      vec3 c = (texture2D(tScene, uv + vec2(-o.x, -o.y)).rgb + texture2D(tScene, uv + vec2(o.x, -o.y)).rgb
              + texture2D(tScene, uv + vec2(-o.x, o.y)).rgb + texture2D(tScene, uv + vec2(o.x, o.y)).rgb) * .25;
      c = pow(c, vec3(1. / 2.2));
      float l = dot(c, vec3(.299, .587, .114));
      float idx = floor(clamp(pow(l, .85) * 1.08, 0., .999) * n);
      vec2 f = fract(p / cell);
      float g = texture2D(tGlyph, vec2((idx + f.x) / n, f.y)).r;
      vec3 hue = c / max(max(c.r, max(c.g, c.b)), 1e-3);
      gl_FragColor = vec4(mix(bg, hue * (.5 + .7 * clamp(l * 1.5, 0., 1.)), g), 1.);
    }`,
  depthTest: false, depthWrite: false,
});
const post = new THREE.Scene(), postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
post.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), ascii));
let W = 1, H = 1;
function resize() {
  W = innerWidth; H = innerHeight;
  const small = W < 760, cw = small ? 7 : 8, ch = small ? 12 : 14;
  renderer.setSize(W, H, false); rt.setSize(Math.ceil(W / cw) * 2, Math.ceil(H / ch) * 2);
  ascii.uniforms.res.value.set(W, H); ascii.uniforms.cell.value.set(cw, ch);
  ascii.uniforms.tGlyph.value?.dispose(); ascii.uniforms.tGlyph.value = glyphAtlas(cw, ch);
  camera.aspect = W / H; if (W > 900) camera.setViewOffset(W, H, -W * 0.12, H * 0.02, W, H); else camera.setViewOffset(W, H, 0, H * 0.2, W, H); camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize(); document.fonts?.ready.then(resize);

// ---------- Fragments, for anything that breaks ----------
const FR = 900;
const frag = new THREE.InstancedMesh(new THREE.BoxGeometry(0.1, 0.1, 0.1), new THREE.MeshStandardMaterial({ roughness: 0.5 }), FR);
frag.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
const frags = [...Array(FR)].map(() => ({ p: new THREE.Vector3(), v: new THREE.Vector3(), r: new THREE.Vector3(), life: 0, max: 1 }));
for (let i = 0; i < FR; i++) frag.setColorAt(i, C.red);
scene.add(frag);
let fragNext = 0;
function burst(at, color, n, speed = 3.2, out = null) {
  for (let k = 0; k < n; k++) {
    const i = fragNext, f = frags[i]; fragNext = (fragNext + 1) % FR;
    f.p.copy(at); f.v.set(Math.random() - 0.5, Math.random() * 0.9, Math.random() - 0.5).normalize().multiplyScalar(speed * (0.4 + Math.random()));
    if (out) f.v.addScaledVector(out, speed * 0.8);
    f.r.set(Math.random() * 6, Math.random() * 6, Math.random() * 6); f.life = f.max = 1.1 + Math.random() * 0.9; frag.setColorAt(i, color);
  }
  frag.instanceColor.needsUpdate = true;
}

// ---------- A lattice: the shell of a 5x5x5 grid that assembles around a protocol ----------
const G = 5, SP = 1.25, OFF = ((G - 1) * SP) / 2;
const latticeNodes = [], latticeIndex = new Map();
for (let x = 0; x < G; x++) for (let y = 0; y < G; y++) for (let z = 0; z < G; z++) {
  if (![x, y, z].some((v) => v === 0 || v === G - 1)) continue;
  latticeIndex.set(`${x},${y},${z}`, latticeNodes.length);
  latticeNodes.push({ target: new THREE.Vector3(x * SP - OFF, y * SP - OFF + 0.1, z * SP - OFF), delay: y * 0.1 + Math.random() * 0.22 });
}
const latticeEdges = [];
for (const [k, i] of latticeIndex) {
  const [x, y, z] = k.split(',').map(Number);
  for (const [dx, dy, dz] of [[1, 0, 0], [0, 1, 0], [0, 0, 1]]) {
    const j = latticeIndex.get(`${x + dx},${y + dy},${z + dz}`); if (j === undefined) continue;
    const m = latticeNodes[i].target.clone().add(latticeNodes[j].target).multiplyScalar(0.5);
    if (Math.max(Math.abs(m.x), Math.abs(m.y - 0.1), Math.abs(m.z)) < OFF - 0.01) continue;
    latticeEdges.push([i, j]);
  }
}
const nodeGeo = new THREE.IcosahedronGeometry(0.11, 1), edgeGeo = new THREE.CylinderGeometry(0.03, 0.03, 1, 6, 1);
const tmp = new THREE.Object3D(), up = new THREE.Vector3(0, 1, 0), v1 = new THREE.Vector3(), col = new THREE.Color();
function makeLattice(parent) {
  const nodes = latticeNodes.map((n) => ({ ...n, start: n.target.clone().normalize().multiplyScalar(9 + Math.random() * 5).add(new THREE.Vector3((Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4)), pos: new THREE.Vector3(), t: 0, flash: 0 }));
  const nm = new THREE.InstancedMesh(nodeGeo, new THREE.MeshStandardMaterial({ roughness: 0.4 }), nodes.length);
  const em = new THREE.InstancedMesh(edgeGeo, new THREE.MeshStandardMaterial({ roughness: 0.5 }), latticeEdges.length);
  nm.instanceMatrix.setUsage(THREE.DynamicDrawUsage); em.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  for (let i = 0; i < nodes.length; i++) nm.setColorAt(i, C.dim); for (let i = 0; i < latticeEdges.length; i++) em.setColorAt(i, C.dim);
  nm.visible = em.visible = false; parent.add(nm, em);
  const L = { nodes, L: 0, Lt: 0, sweep: -10, rate: 0.9,
    update(dt, t) {
      L.L += Math.sign(L.Lt - L.L) * Math.min(Math.abs(L.Lt - L.L), dt * L.rate);
      nm.visible = em.visible = L.L > 0.001;
      if (!nm.visible) return;
      nodes.forEach((n, i) => {
        n.t = clamp01((L.L - n.delay) / 0.75); const e = spring(n.t);
        n.pos.lerpVectors(n.start, n.target, e); n.pos.y += Math.sin(t * 1.4 + i) * 0.03 * e;
        n.flash = Math.max(0, n.flash - dt * 1.8);
        tmp.position.copy(n.pos); tmp.rotation.set(0, 0, 0); tmp.scale.setScalar(Math.max(0.0001, Math.min(1, n.t * 2))); tmp.updateMatrix(); nm.setMatrixAt(i, tmp.matrix);
        const band = Math.exp(-((n.target.y - L.sweep) ** 2) / 0.35);
        nm.setColorAt(i, col.copy(C.dim).lerp(C.white, 0.2 + band * 0.8).lerp(C.warm, band * 0.5).lerp(C.red, n.flash));
      });
      latticeEdges.forEach(([i, j], k) => {
        const A = nodes[i], B = nodes[j], s = Math.min(A.t, B.t);
        v1.subVectors(B.pos, A.pos); const len = v1.length();
        tmp.position.addVectors(A.pos, B.pos).multiplyScalar(0.5); tmp.quaternion.setFromUnitVectors(up, v1.normalize());
        tmp.scale.set(Math.max(0.0001, s), s > 0.98 ? len : 0.0001, Math.max(0.0001, s)); tmp.updateMatrix(); em.setMatrixAt(k, tmp.matrix); tmp.quaternion.identity();
        const band = Math.exp(-((((A.target.y + B.target.y) / 2) - L.sweep) ** 2) / 0.35);
        em.setColorAt(k, col.copy(C.dim).lerp(C.white, 0.02 + band * 0.9).lerp(C.warm, band * 0.5).lerp(C.red, Math.max(A.flash, B.flash)));
      });
      nm.instanceMatrix.needsUpdate = em.instanceMatrix.needsUpdate = nm.instanceColor.needsUpdate = em.instanceColor.needsUpdate = true;
    },
    hit(pLocal) { nodes.forEach((n) => { const d = n.pos.distanceTo(pLocal); if (d < 2.2) n.flash = Math.max(n.flash, 1 - d / 2.2); }); },
  };
  return L;
}

// ---------- Protocols on a ring, each with its keys and its own lattice ----------
const RING = 11, monoGeo = new RoundedBoxGeometry(1.5, 2.6, 1.5, 4, 0.14), keyGeo = new THREE.OctahedronGeometry(0.34, 0);
const tags = $('tags');
const P = PROTOCOLS.map(([name, nkeys], i) => {
  const a = (i / PROTOCOLS.length) * Math.PI * 2 + Math.PI / 2;
  const g = new THREE.Group(); g.position.set(Math.cos(a) * RING, 0, Math.sin(a) * RING); scene.add(g);
  const mat = new THREE.MeshStandardMaterial({ color: C.warm.clone(), roughness: 0.55, metalness: 0.05 });
  const mono = new THREE.Mesh(monoGeo, mat); mono.rotation.y = -a; g.add(mono);
  const keys = [...Array(nkeys)].map((_, k) => { const m = new THREE.Mesh(keyGeo, new THREE.MeshStandardMaterial({ color: C.warm.clone(), roughness: 0.35, flatShading: true })); m.userData = { alive: 1, s: 1, k }; g.add(m); return m; });
  const slab = new THREE.Mesh(new RoundedBoxGeometry(1.5, 0.34, 1.5, 3, 0.08), new THREE.MeshStandardMaterial({ color: C.white, roughness: 0.5, emissive: C.warm, emissiveIntensity: 0.2 })); slab.visible = false; g.add(slab);
  const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = name; tags.append(tag);
  return { name, nkeys, g, mat, mono, keys, slab, tag, colT: C.warm.clone(), lattice: makeLattice(g), keyN: 1, slabT: -1, shake: 0, s: 1, hit: false };
});
// Three signer pillars, around whichever protocol the story follows.
const pillars = [0, 1, 2].map((i) => {
  const a = Math.PI / 2 + (i * Math.PI * 2) / 3;
  const m = new THREE.Mesh(new RoundedBoxGeometry(0.46, 3.6, 0.46, 3, 0.1), new THREE.MeshStandardMaterial({ color: C.dim.clone(), roughness: 0.45, emissive: C.warm.clone(), emissiveIntensity: 0 }));
  m.userData = { sign: 0, cur: 0, ox: Math.cos(a) * 4.2, oz: Math.sin(a) * 4.2 }; m.visible = false; scene.add(m); return m;
});
const shots = [];
function fire(p, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, y = (Math.random() - 0.3) * 4;
    const m = new THREE.Mesh(keyGeo, new THREE.MeshStandardMaterial({ color: C.red, flatShading: true, emissive: C.red, emissiveIntensity: 0.4 }));
    m.position.set(p.g.position.x + Math.cos(a) * 11, y, p.g.position.z + Math.sin(a) * 11); scene.add(m);
    shots.push({ m, p, delay: i * 0.35, v: p.g.position.clone().sub(m.position).normalize().multiplyScalar(7.5) });
  }
}
// The quantum wave: a red ring that sweeps the whole ring of protocols.
const wave = new THREE.Mesh(new THREE.TorusGeometry(1, 0.035, 8, 128), new THREE.MeshStandardMaterial({ color: C.red, emissive: C.red, emissiveIntensity: 0.8 }));
wave.rotation.x = Math.PI / 2; wave.visible = false; scene.add(wave);

// ---------- Camera and per-frame update ----------
const S = { focus: new THREE.Vector3(), focusT: new THREE.Vector3(), dist: 48, distT: 48, el: 0.8, elT: 0.8, sel: null, pillars: 0, pillarsT: 0, wave: -1 };
const pointer = { x: 0, y: 0 };
addEventListener('pointermove', (e) => { pointer.x = e.clientX / W - 0.5; pointer.y = e.clientY / H - 0.5; });
const proj = new THREE.Vector3(), local = new THREE.Vector3(), wp = new THREE.Vector3();
let az = 0.3, last = performance.now(), t = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000) * (reduce ? 4 : 1); last = now; t += dt;
  if (!reduce) az += dt * (S.sel ? 0.12 : 0.05);
  S.focus.lerp(S.focusT, 1 - Math.exp(-2.2 * dt)); S.dist = damp(S.dist, S.distT, 2.2, dt); S.el = damp(S.el, S.elT, 2.2, dt);
  const a = az + pointer.x * 0.3, el = S.el - pointer.y * 0.1;
  camera.position.set(S.focus.x + Math.sin(a) * Math.cos(el) * S.dist, S.focus.y + Math.sin(el) * S.dist + 0.4, S.focus.z + Math.cos(a) * Math.cos(el) * S.dist);
  camera.lookAt(S.focus.x, S.focus.y + 0.2, S.focus.z);

  P.forEach((p, i) => {
    p.s = damp(p.s, S.sel && S.sel !== p ? 0 : 1, 4, dt); p.g.visible = p.s > 0.01; p.g.scale.setScalar(Math.max(0.0001, p.s));
    p.mat.color.lerp(p.colT, 1 - Math.exp(-3 * dt));
    p.shake = Math.max(0, p.shake - dt * 1.6);
    p.mono.position.set(Math.sin(t * 55) * p.shake * 0.08, Math.sin(t * 0.6 + i) * 0.12, 0);
    p.keys.forEach((k) => { const d = k.userData; d.s = damp(d.s, p.keyN * d.alive, 6, dt); const ang = (d.k / p.nkeys) * Math.PI * 2 + t * 0.35; k.position.set(Math.cos(ang) * 2.6, 0.2 + Math.sin(t * 0.9 + d.k) * 0.35, Math.sin(ang) * 2.6); k.rotation.set(t * 0.7 + d.k, t * 0.9, 0); k.scale.setScalar(Math.max(0.0001, d.s)); k.visible = d.s > 0.01; });
    if (p.slabT >= 0) { p.slabT = Math.min(1, p.slabT + dt * 1.3); p.slab.visible = true; p.slab.position.y = 1.49 + (1 - spring(p.slabT)) * 3.2; }
    p.lattice.update(dt, t);
    proj.set(p.g.position.x, 2.0, p.g.position.z).project(camera);
    p.tag.style.transform = `translate(${(proj.x * 0.5 + 0.5) * W}px, ${(-proj.y * 0.5 + 0.5) * H}px) translate(-50%, -100%)`;
    p.tag.style.visibility = proj.z > 1 || !p.g.visible ? 'hidden' : 'visible';
  });

  S.pillars += Math.sign(S.pillarsT - S.pillars) * Math.min(Math.abs(S.pillarsT - S.pillars), dt * 0.8);
  const anchor = S.sel ? S.sel.g.position : S.focusT;
  pillars.forEach((p, i) => {
    const d = p.userData; p.position.set(anchor.x + d.ox, -9 + spring(clamp01((S.pillars - i * 0.18) / 0.8)) * 9.2, anchor.z + d.oz); p.visible = p.position.y > -8.5;
    d.cur = damp(d.cur, d.sign, 5, dt); p.material.color.copy(C.dim).lerp(C.white, 0.25).lerp(C.warm, d.cur); p.material.emissiveIntensity = d.cur * 0.7; p.rotation.y = t * 0.2 + i;
  });

  for (let i = 0; i < FR; i++) {
    const f = frags[i];
    if (f.life > 0) { f.life -= dt; f.v.y -= 5.5 * dt; f.v.multiplyScalar(1 - dt * 0.6); f.p.addScaledVector(f.v, dt); }
    const s = f.life > 0 ? Math.min(1, (f.life / f.max) * 1.6) : 0;

  }

  for (let i = shots.length - 1; i >= 0; i--) {
    const s = shots[i];
    if (s.delay > 0) { s.delay -= dt; continue; }
    s.m.position.addScaledVector(s.v, dt); s.m.rotation.x += dt * 4; s.m.rotation.y += dt * 5;
    local.copy(s.m.position).sub(s.p.g.position);
    if (Math.max(Math.abs(local.x), Math.abs(local.y - 0.1), Math.abs(local.z)) < OFF + 0.15) {
      burst(s.m.position, C.red, 34, 2.6, local.clone().normalize()); s.p.lattice.hit(local);
      scene.remove(s.m); s.m.material.dispose(); shots.splice(i, 1);
    }
  }

  // The wave grows from the center; each protocol it reaches loses its keys and turns red.
  if (S.wave >= 0) {
    S.wave += dt * 7; wave.visible = true; wave.scale.setScalar(S.wave); wave.material.emissiveIntensity = Math.max(0, 1.2 - S.wave / 16);
    if (S.wave > RING - 0.3) P.forEach((p) => { if (p.hit) return; p.hit = true; p.keys.forEach((k) => { k.userData.alive = 0; burst(k.getWorldPosition(wp), C.red, 14, 3); }); p.colT.copy(C.red); p.shake = 0.8; });
    if (S.wave > 20) { S.wave = -1; wave.visible = false; }
  }

  renderer.setRenderTarget(rt); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(post, postCam);
  requestAnimationFrame(frame);
}
